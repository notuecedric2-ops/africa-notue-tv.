<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Africa Notue TV - TV en direct</title>
  <!-- Player Hls.js pour lire les flux IPTV .m3u8 -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background-color: #121212; color: #ffffff; text-align: center; }
    header { background-color: #1f1f1f; padding: 20px; border-bottom: 2px solid #e50914; }
    h1 { color: #e50914; }
    .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }
    .video-container { position: relative; padding-bottom: 56.25%; height: 0; background: #000; margin-bottom: 20px; border-radius: 8px; overflow: hidden; }
    video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    .channels-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
    .channel-btn { background: #2a2a2a; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-size: 14px; transition: background 0.2s; }
    .channel-btn:hover { background: #e50914; }
  </style>
</head>
<body>

  <header>
    <h1>Africa Notue TV</h1>
    <p>Vos chaînes en français libres de droit en direct</p>
  </header>

  <div class="container">
    <div class="video-container">
      <video id="video" controls autoplay muted></video>
    </div>

    <h3>Sélectionnez une chaîne :</h3>
    <br>
    <div class="channels-grid">
      <!-- Chaînes légales et gratuites (iptv-org / flux publics) -->
      <button class="channel-btn" onclick="playStream('https://france24-hls-live-f24.akamaized.net/hls/live/2038318/F24_FR_PAD_HLS/master.m3u8')">France 24</button>
      <button class="channel-btn" onclick="playStream('https://f24hls-i.akamaihd.net/hls/live/221193/F24_FR_LO_HLS/master.m3u8')">Africanews</button>
      <button class="channel-btn" onclick="playStream('https://arte-hls.akamaized.net/hls/live/2038162/arte_fr/index.m3u8')">Arte Français</button>
      <button class="channel-btn" onclick="playStream('https://cgtn-f-live.akamaized.net/hls/live/2038302/cgtnf/master.m3u8')">CGTN Français</button>
      <button class="channel-btn" onclick="playStream('https://euronews-euronews-french-1-fr.samsung.wurl.tv/playlist.m3u8')">Euronews FR</button>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');

    function playStream(url) {
      if (Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function() {
          video.play();
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        // Support Safari / iOS
        video.src = url;
        video.addEventListener('loadedmetadata', function() {
          video.play();
        });
      }
    }

    // Charger la première chaîne par défaut
    playStream('https://france24-hls-live-f24.akamaized.net/hls/live/2038318/F24_FR_PAD_HLS/master.m3u8');
  </script>

</body>
</html>
